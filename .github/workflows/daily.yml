name: Daily Forecast
on:
  schedule:
    - cron: '0 6 * * 1-5'
  workflow_dispatch:
jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-
      - run: pip install yfinance torch transformers pandas einops huggingface_hub safetensors requests
      - name: Run daily analysis and send email
        env:
          GMAIL_ADRESS: ${{ secrets.GMAIL_ADRESS }}
          BREVO_SMTP: ${{ secrets.BREVO_SMTP }}
        run: python send_email.py
      - name: Save screener history
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add screener_history.json forecast_history.json
          git diff --staged --quiet || git commit -m "Update screener history [skip ci]"
          git push
