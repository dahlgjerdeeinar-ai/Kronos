name: Daily Forecast
on:
  schedule:
    - cron: '0 7 * * 1-5'
jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install yfinance torch transformers pandas
      - run: python daily_forecast.py
